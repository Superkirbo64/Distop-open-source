services:
  instance:
    build:
      context: .
      dockerfile: apps/node-server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      INSTANCE_NAME: "${INSTANCE_NAME:-Mi instancia Distop}"
      # Obligatorio: genera uno con  openssl rand -hex 32  y ponlo en .env
      AUTH_SECRET: "${AUTH_SECRET:?falta AUTH_SECRET, generalo con: openssl rand -hex 32}"
      DATABASE_PATH: "/data/app.db"
      DEFAULT_STORAGE_PATH: "/data/uploads"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      GUEST_MODE_ENABLED: "${GUEST_MODE_ENABLED:-true}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-500}"
      # Ponlo en true si delante hay un túnel o un proxy inverso; si no, todas
      # las peticiones parecerán venir de la misma IP y los límites por IP
      # tratarán a toda tu comunidad como a una sola persona.
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      MAX_REGISTRATIONS_PER_HOUR: "${MAX_REGISTRATIONS_PER_HOUR:-30}"
      MAX_GUESTS_PER_HOUR: "${MAX_GUESTS_PER_HOUR:-60}"
      NODE_ENV: "production"
    volumes:
      # Tus datos viven aquí. Este directorio ES tu copia de seguridad (§21).
      - ./data:/data
    restart: unless-stopped
