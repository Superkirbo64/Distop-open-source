# Release (§16): al empujar un tag v* se construyen y publican los instaladores
# en GitHub Releases — distribución y auto-update sin coste (§3).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Quien crea la release es UN job dedicado, y los demás solo suben ficheros.
# Antes la creaba electron-builder con `--publish always`, y bastaba que la
# release del tag ya existiera para que el job de Windows muriera con
# "422 Validation Failed: already_exists" — arrastrando a Android y al resto,
# que dependían de él. Dos versiones seguidas se publicaron a medias por eso.
#
# Windows: NSIS .exe + latest.yml (el feed que lee electron-updater).
# Android: APK firmado con el keystore de los secretos (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, más la
# variable ANDROID_SIGNING). Antes, sin secretos, se publicaba el APK SIN
# firmar: un fichero que el instalador de Android rechaza de plano. Salió así
# dos releases seguidas sin que nada fallara. Ahora se verifica con apksigner
# antes de subirlo, y si no está firmado el job muere.
# Docker: imagen multi-arch del servidor en GHCR (arm64 para Raspberry Pi y
# VPS ARM, amd64 para el resto). Corre en paralelo: no toca la release.
#
# ---------------------------------------------------------------------------
# Cadena de suministro
#
# Este workflow es el punto donde el código del repositorio se convierte en los
# binarios que ejecuta gente que no nos conoce: un .exe, un APK y una imagen que
# acaba corriendo en el VPS o la Raspberry de cada comunidad. Todo lo que entre
# aquí sin verificar sale firmado con nuestro nombre.
#
#  * Acciones fijadas por SHA (`# vN` al lado). Una etiqueta de acción es un
#    puntero móvil: quien controle ese repositorio la reapunta y a partir del
#    siguiente tag publicamos lo que él quiera, con permiso de escritura sobre
#    la release y sobre GHCR. Un SHA no se reapunta. Para que fijar no sea
#    congelar, .github/dependabot.yml abre PR semanales que mueven los SHA.
#  * Ningún secreto se interpola dentro de un `run:`. Van por bloques `env:`
#    y se leen como variables de shell. El porqué, en el job de Android.
#  * La imagen se escanea (Trivy), lleva procedencia y SBOM, y se firma con
#    cosign sin clave (OIDC de Actions).
#
# Cómo verifica un usuario la imagen que va a instalar en su servidor. No hace
# falta cuenta ni clave nuestra: la firma se comprueba contra el registro
# público de Sigstore.
#
#   cosign verify ghcr.io/superkirbo64/distop:0.1.7 \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       "^https://github[.]com/superkirbo64/distop/[.]github/workflows/release[.]yml@refs/tags/v"
#
# La identidad NO es una persona: es este fichero, en este repositorio, corriendo
# sobre un tag v*. Si alguien publica una imagen a mano, desde una rama o desde
# otro repositorio, la firma no existe o no casa con ese regex y el comando
# falla. Y para ver de qué commit salió, con la procedencia que se adjunta:
#
#   docker buildx imagetools inspect ghcr.io/superkirbo64/distop:0.1.7 \
#     --format "{{json .Provenance}}"
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Único sitio donde nace una release. Idempotente a propósito: relanzar el
  # workflow sobre un tag ya publicado no puede volver a romperlo.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Crear la release del tag si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${FLAGS[@]}"

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # `--publish never`: construir y publicar son dos cosas, y mezclarlas fue
      # exactamente el fallo. electron-builder sigue escribiendo latest.yml en
      # el directorio de salida —lo necesita electron-updater—, solo que ya no
      # habla con la API de GitHub.
      - run: npm run dist --workspace @distop/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publicar instalador y feed de actualización
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" *.exe *.blockmap latest.yml --clobber

  android:
    # Ya no depende de windows: la release existe antes que los dos.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      # El servidor embebido del APK (motor Node 18 + sqlite WASM).
      - run: node scripts/stage-server.mjs --mobile apps/web/dist/nodejs
      - run: npx cap sync android
        working-directory: apps/mobile

      # El paquete que usa scripts/termux-host.sh: la instancia lista para
      # correr con solo Node (Termux en Android, o cualquier equipo sin git).
      # Misma disposición que los recursos de la app de escritorio.
      #
      # Va ANTES del APK a propósito: no depende de Gradle ni del keystore, y
      # ese orden impide que un fallo al firmar se lleve por delante el paquete
      # del que dependen Termux y el instalador de VPS — el mismo acoplamiento
      # que cuenta la cabecera de este fichero.
      - name: Empaquetar host bundle (Termux / self-host)
        run: |
          node scripts/stage-protocol.mjs
          mkdir -p bundle/node-server/node_modules/@distop/protocol bundle/web
          cp apps/node-server/*.ts apps/node-server/package.json bundle/node-server/
          rm -f bundle/node-server/*.test.ts
          cp -r apps/desktop/staging/protocol/. bundle/node-server/node_modules/@distop/protocol/
          cp -r node_modules/ws bundle/node-server/node_modules/ws
          cp -r apps/web/dist bundle/web/dist
          (cd bundle && zip -rq ../distop-host-bundle.zip .)

      - name: Publicar host bundle y script de Termux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" distop-host-bundle.zip scripts/termux-host.sh --clobber

      # Aquí vivían los dos fallos de manejo de secretos de este workflow.
      #
      # 1) El secreto interpolado dentro del `run:`. Una expresión ${{ }} no es
      #    una variable: GitHub pega el TEXTO del secreto en el script antes de
      #    ejecutarlo. El secreto acaba en la línea de comandos del proceso
      #    —visible en /proc para cualquier otro proceso del runner— y un
      #    secreto que contenga comillas o una sustitución de comandos deja de
      #    ser un dato y pasa a ser código que corre con nuestro token. Ahora
      #    llega por `env:` y el script solo ve $VARIABLE, que el shell trata
      #    como dato pase lo que pase dentro.
      #
      # 2) Escribir las contraseñas en $GITHUB_ENV con echo. Ese fichero se
      #    parsea línea a línea como CLAVE=VALOR, así que un secreto con un
      #    salto de línea inyecta variables ARBITRARIAS en todos los pasos
      #    siguientes del job (PATH, NODE_OPTIONS, GH_TOKEN...). Y aunque el
      #    secreto fuese limpio, GITHUB_ENV es de job entero: las contraseñas
      #    del keystore quedaban en el entorno de pasos que no las necesitan,
      #    como el que sube ficheros a la release.
      #
      # La alternativa que se valoró era un gradle.properties con permisos 600.
      # Se descartó: app/build.gradle lee la firma con System.getenv(...) y ese
      # fichero no forma parte de este cambio, así que un fichero de propiedades
      # no lo leería nadie. Y aunque lo leyera, aquí sería peor: un fichero
      # sobrevive al paso que lo escribe, se lo puede llevar la caché de Gradle
      # y lo puede abrir cualquier script posterior; un `env:` de PASO existe
      # solo mientras corre ese proceso. Se queda el env, acotado al paso.
      #
      # printf en vez de echo: echo interpreta -n/-e y barras invertidas según
      # el shell, y aquí se decodifica base64, donde un byte de más rompe el
      # keystore. umask 077 antes de la redirección crea el fichero ya en 0600,
      # sin la ventana en la que existe legible por todos.
      - name: Preparar keystore (si hay secretos)
        if: ${{ vars.ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Un secreto mal pegado decodifica a cero bytes: sin esto, Gradle
          # publicaría un APK sin firmar sin que nadie se enterase.
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Construir APK
        working-directory: apps/mobile/android
        env:
          # app/build.gradle decide si firma mirando si ANDROID_KEYSTORE_PATH
          # tiene valor: la cadena vacía es falsy en Groovy, así que sin
          # secretos esto vale "" y el APK sale sin firmar, igual que antes.
          ANDROID_KEYSTORE_PATH: ${{ vars.ANDROID_SIGNING == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Un APK sin firmar no es un APK a medias: el instalador de Android lo
      # rechaza sin más ("no se pudo analizar el paquete"). Gradle lo produce
      # igual y lo llama app-…-release-unsigned.apk, que casaba con el patrón de
      # abajo, así que se renombraba a Distop-vX.Y.Z.apk y se publicaba tan
      # tranquilo. apksigner es quien lo dice de verdad, mirando la firma y no el
      # nombre: si no verifica, aquí se acaba la release.
      - name: Verificar la firma y renombrar el APK
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*arm64*.apk | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "Distop-${GITHUB_REF_NAME}.apk"

      - name: Publicar APK en la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "Distop-${GITHUB_REF_NAME}.apk" --clobber

  host-tools:
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validar el instalador de VPS
        run: |
          bash -n scripts/install-vps.sh
          shellcheck --severity=error scripts/install-vps.sh
          cd scripts
          sha256sum install-vps.sh > install-vps.sh.sha256
          sha256sum --check install-vps.sh.sha256
      - name: Smoke real en Ubuntu limpio y persistencia tras reinicio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # github.actor tampoco se interpola dentro del `run:`. No es un
          # secreto, pero es un dato que decide quien empuja el tag: entra como
          # variable y el shell lo trata como una cadena, nunca como código.
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | sudo docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          sudo bash scripts/install-vps.sh --version "${GITHUB_REF_NAME#v}" --no-tailscale --name "Distop smoke"
          BEFORE=$(curl --fail --silent http://127.0.0.1:5000/api/v1/info | jq -r .instance_id)
          test -n "$BEFORE" && test "$BEFORE" != null
          # Este reinicio es además la prueba del anclaje por digest: la unidad
          # systemd ya no menciona ninguna etiqueta, así que si el instalador
          # escribiera mal la referencia, aquí no volvería a arrancar.
          sudo systemctl restart distop
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/health >/dev/null && break
            sleep 1
          done
          AFTER=$(curl --fail --silent http://127.0.0.1:5000/api/v1/info | jq -r .instance_id)
          test "$BEFORE" = "$AFTER"
          sudo test -s /var/lib/distop/app.db
      - name: Publicar instalador verificable
        working-directory: scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" install-vps.sh install-vps.sh.sha256 --clobber

  # Imagen multi-arch del servidor: linux/arm64 (Raspberry Pi, VPS ARM) y
  # linux/amd64. Corre en paralelo, sin needs: no toca la release de GitHub,
  # solo publica en GHCR. metadata-action pasa el owner a minúsculas
  # (ghcr.io/superkirbo64/distop). Es la pieza de la que dependen el script de
  # VPS, la Raspberry y los catálogos de self-hosting: sin ella no hay nada
  # que instalar de un clic.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token: write es lo que permite a cosign firmar SIN clave: el job pide
      # a GitHub un token OIDC que dice "soy release.yml de este repositorio en
      # este tag", y Fulcio le devuelve un certificado efímero a partir de esa
      # identidad. No hay clave privada que guardar, rotar ni perder.
      # Vive SOLO en este job, y no a nivel de workflow, porque cualquier job
      # que lo tenga puede pedir ese token y presentarse como este workflow ante
      # Sigstore o ante cualquier nube que confíe en el OIDC de Actions (§22,
      # permisos mínimos). El job de Android, que ejecuta Gradle y sus plugins
      # de terceros, es exactamente el sitio donde no queremos esa capacidad.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # qemu solo emula la etapa final arm64; la etapa client del Dockerfile
      # compila la web en la arquitectura nativa del runner gracias a
      # --platform=$BUILDPLATFORM (el resultado es JS, igual en ambas).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/distop
          # `latest` existe para el "docker compose up" casual de la página de
          # descarga; un despliegue serio fija versión o digest, nunca "lo
          # último que haya", para que actualizar sea una decisión y no un
          # efecto secundario de reiniciar.
          # En modo auto, las versiones estables actualizan `latest` y las
          # prereleases (v*-rc*, v*-beta*, etc.) quedan aisladas en su tag.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/node-server/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance: buildx adjunta al índice una atestación in-toto/SLSA que
          # dice de qué commit, qué Dockerfile y qué runner salió la imagen. Es
          # lo que convierte "confía en que esto lo hicimos nosotros" en algo
          # comprobable por quien la instala.
          # sbom: el inventario de lo que va dentro. Sin él, cuando salga el
          # próximo CVE de una librería del sistema base, nadie —ni nosotros—
          # puede responder "¿está en la 0.1.7?" sin descargar la imagen y
          # destriparla. Es también lo que hace útil este escaneo meses después.
          # Ambas viajan como manifiestos extra dentro del índice multi-arch:
          # GHCR los admite, pero un registro antiguo puede rechazar el push.
          provenance: true
          sbom: true

      # La referencia por digest, en minúsculas: GHCR exige el owner en
      # minúsculas y github.repository_owner conserva las mayúsculas de la
      # cuenta (metadata-action ya lo baja para sus tags, pero aquí hace falta
      # el digest exacto que se acaba de publicar, no una etiqueta).
      # Trabajar por digest y no por etiqueta no es un detalle: entre el push y
      # este paso la etiqueta se puede haber reescrito, y escanearíamos y
      # firmaríamos algo distinto de lo que se acaba de construir.
      - id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'image=ghcr.io/%s/distop@%s\n' "${OWNER,,}" "$DIGEST" >> "$GITHUB_OUTPUT"

      # El escaneo va DESPUÉS de publicar por una limitación real de buildx: un
      # índice multi-plataforma no se puede cargar en el daemon local (`load`
      # entiende una sola arquitectura), así que o se publica y se escanea el
      # digest, o se construye la imagen dos veces y se duplican los minutos de
      # CI (§3). Se escanea el digest recién publicado y el job falla antes de
      # firmar: una imagen que no pasa el filtro queda publicada pero SIN firma,
      # y `cosign verify` —el paso que documenta la cabecera— la rechaza.
      #
      # ignore-unfixed y solo CRITICAL no es laxitud: es lo que hace que este
      # filtro siga existiendo dentro de un año. node:24-alpine arrastra en
      # cualquier momento algún CVE sin parche del upstream, y fallar por eso
      # bloquearía TODAS las releases indefinidamente por algo que no podemos
      # arreglar (§29.3: mejor decir qué no cubre que fingir que cubre todo).
      # Un CRITICAL con arreglo disponible sí es cosa nuestra: basta reconstruir
      # sobre la base actualizada, que es justo el PR semanal que abre
      # Dependabot sobre apps/node-server/Dockerfile.
      #
      # Se analiza la variante que corre en el runner (amd64). La arm64 sale del
      # mismo node:24-alpine y del mismo JS, así que el inventario de paquetes
      # es equivalente; el día que las bases diverjan habrá que escanear las dos.
      - name: Escanear la imagen publicada (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy descarga su base de datos de vulnerabilidades desde GHCR y lee
          # de GHCR la imagen: sin credenciales choca con el límite de
          # peticiones anónimas y el job fallaría por algo que no tiene nada que
          # ver con la imagen que estamos publicando.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # scanners explícito: por defecto Trivy también busca secretos, y un
          # hallazgo de secretos no tiene "arreglo disponible", así que un falso
          # positivo bloquearía la release sin que haya nada que actualizar —
          # justo lo contrario de la regla que describe el bloque de arriba. La
          # puerta debe ser exactamente lo que dice ser.
          scanners: vuln
          exit-code: "1"

      # Firma sin clave: cosign pide el certificado efímero con el token OIDC
      # del job (de ahí el id-token: write de arriba), firma, y deja constancia
      # en el log público de transparencia de Sigstore. No hay clave privada en
      # ningún secreto del repositorio, así que no hay nada que rotar ni que
      # robar; el certificado caduca en minutos y lo que queda es la entrada
      # firmada en Rekor, que cualquiera puede consultar.
      #
      # Se firma el DIGEST del índice, no una etiqueta: firmar `:latest` sería
      # firmar "lo que haya ahí ahora", que es precisamente lo que no queremos
      # decirle a quien instala. `cosign verify` sobre una etiqueta la resuelve
      # a este mismo digest, así que el usuario puede seguir escribiendo la
      # versión legible.
      - name: Firmar la imagen (cosign keyless)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: cosign sign --yes "$IMAGE"
