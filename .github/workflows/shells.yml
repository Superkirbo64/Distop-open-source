# Los dos cascarones que NO se compilan en el CI normal (§29.5).
#
# El CI de siempre corre typecheck y tests de TypeScript. El APK y el cascarón
# Tauri no son TypeScript: el primero solo se construía al taguear —dos
# releases salieron con un APK que Android rechazaba y nadie se enteró hasta
# mirar los bytes— y el segundo no se construía en ningún sitio, así que su
# código Rust se escribía sin que nada lo compilara nunca.
#
# Esto no publica nada. Solo responde a "¿esto sigue compilando?" antes de que
# lo responda una release rota.
#
# Filtro por rutas: son dos jobs caros (un SDK de Android y una cadena de
# compilación de Rust) para un código que se toca poco. Un cambio en el cliente
# web no los despierta porque no cambia ni el Java ni el Rust; lo que sí los
# despierta es tocar los cascarones, el protocolo o el script que empaqueta el
# servidor dentro de ellos.
name: shells

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "scripts/apk-smoke.mjs"
      - "packages/protocol/**"
      - "scripts/stage-server.mjs"
      - "scripts/stage-protocol.mjs"
      - ".github/workflows/shells.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/apk-smoke.mjs"
      - "packages/protocol/**"
      - "scripts/stage-server.mjs"
      - "scripts/stage-protocol.mjs"
      - ".github/workflows/shells.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ¿El APK se construye? Incluye el paso que faltaba: que build.gradle sea
  # válido. La versión sale de package.json, y un error ahí solo se veía al
  # publicar.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: node scripts/stage-server.mjs --mobile apps/web/dist/nodejs
      - run: npx cap sync android
        working-directory: apps/mobile
      # Debug y no release: aquí solo se pregunta si compila. Firmar es cosa de
      # release.yml, que es el único que tiene el keystore.
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      # El APK de depuración se firma solo, con la clave que gradle se genera en
      # el runner: no hace falta keystore ni secreto ninguno para instalarlo y
      # probarlo en un móvil. Lo que NO sirve es para publicar ni para
      # actualizar encima de una release —esa clave cambia en cada máquina—,
      # y por eso release.yml sigue exigiendo el keystore de verdad.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distop-apk-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*arm64*.apk
          if-no-files-found: error
      # El del emulador: x86_64. Las imágenes de Android 13 no traducen ARM, y
      # el APK de teléfono (arm64) no se instala ahí (NO_MATCHING_ABIS).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distop-apk-debug-x86_64
          path: apps/mobile/android/app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error

      - name: La versión del APK no puede ser la de fábrica
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/debug/*arm64*.apk | head -n 1)
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          # aapt del build-tools instalado por el propio Gradle.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "versionName='$VERSION'"

  # ¿El APK funciona en un Android de verdad? Compilar no basta: la app pasaba
  # en Chrome simulando Capacitor y en el teléfono Explorar decía "algo falló".
  # Abre el APK en un emulador y recorre lo que hace una persona
  # (scripts/apk-smoke.mjs): crear el usuario, abrir Explorar, ver comunidades.
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distop-apk-debug-x86_64
          path: apk
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # El emulador necesita KVM; en los runners de Ubuntu hay que abrirlo a mano.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Android 13 y no 14: no trae ISRG Root X2 de fábrica, que es justo lo
          # que rompía Explorar en teléfonos reales. No más viejo: la imagen de
          # Android 11 lleva una WebView de Chrome 83 que ningún teléfono en uso
          # tiene y en la que el cliente ni carga.
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node scripts/apk-smoke.mjs "$(ls apk/*.apk | head -n 1)" apk-smoke.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: apk-smoke
          path: apk-smoke.png
          if-no-files-found: ignore

  # El cascarón Tauri (apps/desktop-tauri) quedó como proyecto futuro el
  # 2026-09-12: fuera del CI hasta que se retome. El escritorio es Electron.
