# CI (§16.1): cada push y PR pasa typecheck y la suite del node-server.
#
# Las acciones se fijan por SHA, no por etiqueta. `actions/checkout@v4` es una
# etiqueta MÓVIL: quien controle ese repositorio (o le roben las credenciales)
# la reapunta y a partir del siguiente push nuestro CI ejecuta código ajeno con
# el token del repositorio, sin que nadie cambie una línea aquí. Un SHA no se
# puede reapuntar. El coste —quedarse congelado en una versión con fallos de
# seguridad— lo cubre .github/dependabot.yml, que abre PR semanales con el SHA
# nuevo; el comentario `# vN` es lo que Dependabot lee para saber qué actualizar
# y lo que nos deja entender el diff sin ir a buscar cada hash.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Sin este bloque el workflow hereda el permiso POR DEFECTO del repositorio, que
# en repos creados antes del cambio de 2023 sigue siendo read/write sobre TODO:
# contenido, packages, deployments... Este CI solo necesita leer el árbol, y
# corre sobre PRs, así que el token que ve `npm ci` (y cualquier script de
# postinstall que arrastre una dependencia) debe poder hacer lo mínimo (§22).
# directory.yml e infra.yml ya lo declaraban; este fichero era el hueco.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck --workspace @distop/desktop
      - run: npm test
      - run: npm test --workspace @distop/desktop
