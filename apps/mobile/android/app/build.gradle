apply plugin: 'com.android.application'

// versionCode y versionName salen de apps/mobile/package.json, que se sube en
// cada release. Estaban clavados a 1 / "1.0", así que para Android TODOS los
// APK publicados eran la misma versión y poner el nuevo encima del anterior no
// era una actualización (§28.6).
// Techo asumido: minor y patch por debajo de 100 (0.1.7 -> 107). Si algún día
// hicieran falta más, se sube el múltiplo, nunca a la inversa: un versionCode
// solo puede crecer, y bajarlo deja a la gente sin poder actualizar.
def pkgVersion = new groovy.json.JsonSlurper().parseText(file('../../package.json').text).version
def semver = pkgVersion.tokenize('.-')
if (semver.size() < 3) {
    throw new GradleException("Versión no semver en apps/mobile/package.json: ${pkgVersion}")
}
def appVersionCode = semver[0].toInteger() * 10000 + semver[1].toInteger() * 100 + semver[2].toInteger()

android {
    namespace "com.distop.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.distop.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // El motor Node embebido (libnode.so) pesa ~45 MB por arquitectura: un APK
    // por ABI en vez de uno universal. A la gente se le da el arm64 (todos los
    // teléfonos reales de la última década); x86_64 es para el emulador.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk false
        }
    }

    // Firma de release por variables de entorno: el keystore JAMÁS entra al
    // repo (§22). En CI llega como secreto; sin variables, el build queda sin
    // firmar y sirve igual para probar en local con la variante debug.
    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
