<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: app: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Distop — Voz</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { padding: 6px; color: white; font: 12px/1.2 Inter, "Segoe UI", system-ui, sans-serif; }
    #room {
      margin: 0 0 5px 8px; max-width: 230px; overflow: hidden; white-space: nowrap;
      text-overflow: ellipsis; color: rgba(255,255,255,.42); font-size: 10px;
      font-weight: 750; letter-spacing: .08em; text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    #people { display: flex; flex-direction: column; gap: 5px; margin: 0; padding: 0; list-style: none; }
    .person {
      display: flex; width: max-content; max-width: 266px; align-items: center; gap: 9px;
      min-height: 48px; padding: 4px 12px 4px 4px; border-radius: 28px;
      opacity: .38;
      transition: opacity 120ms ease;
    }
    .person.speaking { opacity: 1; }
    .avatar {
      display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px;
      overflow: hidden; border: 2px solid rgba(255,255,255,.22); border-radius: 50%;
      background: rgba(20,22,31,.82); color: rgba(255,255,255,.85); font-weight: 800;
    }
    .speaking .avatar { border-color: #43ffac; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { max-width: 190px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 720; text-shadow: 0 2px 5px #000, 0 0 2px #000; }
    .muted::after { content: " · silencio"; color: rgba(255,255,255,.55); font-size: 10px; font-weight: 500; }
    @media (prefers-reduced-motion: reduce) { .person { transition: none; } }
  </style>
</head>
<body>
  <div id="room"></div>
  <ul id="people"></ul>
  <script>
    (function () {
      var room = document.getElementById("room");
      var people = document.getElementById("people");

      function initials(name) {
        return name.trim().split(/\s+/).slice(0, 2).map(function (part) { return part.charAt(0); }).join("").toUpperCase() || "?";
      }

      window.voiceOverlay.onState(function (state) {
        room.textContent = state.channelName || "Sala de voz";
        people.replaceChildren();
        state.participants.forEach(function (participant) {
          var row = document.createElement("li");
          row.className = "person" + (participant.speaking ? " speaking" : "");

          var avatar = document.createElement("span");
          avatar.className = "avatar";
          avatar.textContent = initials(participant.name);
          if (participant.avatarUrl) {
            var image = document.createElement("img");
            image.alt = "";
            image.src = participant.avatarUrl;
            image.addEventListener("load", function () { avatar.textContent = ""; avatar.appendChild(image); }, { once: true });
          }

          var name = document.createElement("span");
          name.className = "name" + (participant.muted ? " muted" : "");
          name.textContent = participant.name;
          row.append(avatar, name);
          people.appendChild(row);
        });
      });
    })();
  </script>
</body>
</html>
