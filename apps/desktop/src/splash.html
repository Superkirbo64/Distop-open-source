<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'self'; img-src 'self'; font-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distop</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("./assets/press-start-2p-latin.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }

      :root {
        color-scheme: dark;
        font-family: "Press Start 2P", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      body {
        opacity: 1;
        transition: opacity 240ms cubic-bezier(0.4, 0, 1, 1);
      }

      body.is-leaving {
        opacity: 0;
      }

      .shell {
        position: absolute;
        inset: 12px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid #302c5c;
        border-radius: 24px;
        background:
          radial-gradient(circle at 50% 48%, rgb(91 108 255 / 0.19), transparent 31%),
          radial-gradient(circle at 18% 100%, rgb(255 69 168 / 0.07), transparent 37%),
          #0b0a14;
        box-shadow:
          0 28px 72px rgb(0 0 0 / 0.58),
          inset 0 1px 0 rgb(243 241 255 / 0.025);
        animation: shell-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, #4a4490 0 1px, transparent 1.2px);
        background-size: 24px 24px;
        opacity: 0.14;
        mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
        animation: field-in 1.2s steps(8, end) both 160ms;
      }

      .shell::after {
        content: "";
        position: absolute;
        inset: -30% 0;
        background: linear-gradient(
          transparent 0 46%,
          rgb(154 166 255 / 0.055) 49%,
          rgb(154 166 255 / 0.11) 50%,
          transparent 54% 100%
        );
        transform: translateY(-48%);
        animation: scan 2.1s linear both 180ms;
      }

      .identity {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        transform: translateY(-2px);
      }

      .logo {
        width: 156px;
        height: 156px;
        display: block;
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        filter: drop-shadow(0 0 20px rgb(91 108 255 / 0.52));
        animation:
          logo-reveal 700ms steps(7, end) forwards 300ms,
          logo-settle 1.7s ease-in-out infinite alternate 1.15s;
      }

      .brand {
        color: #f3f1ff;
        font-size: 25px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        text-transform: uppercase;
        text-shadow:
          3px 3px 0 #302c5c,
          0 0 24px rgb(91 108 255 / 0.28);
        opacity: 0;
        transform: translateY(8px);
        animation: name-reveal 560ms steps(7, end) forwards 840ms;
      }

      @keyframes shell-in {
        from { opacity: 0; transform: scale(0.965); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes field-in {
        from { opacity: 0; transform: scale(1.08); }
        to { opacity: 0.14; transform: scale(1); }
      }

      @keyframes scan {
        0% { transform: translateY(-48%); opacity: 0; }
        12% { opacity: 1; }
        82% { opacity: 1; }
        100% { transform: translateY(48%); opacity: 0; }
      }

      @keyframes logo-reveal {
        0% { opacity: 0; clip-path: inset(0 100% 0 0); transform: scale(0.82); }
        40% { opacity: 1; }
        76% { clip-path: inset(0 0 0 0); transform: scale(1.06); }
        100% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); }
      }

      @keyframes logo-settle {
        from { filter: drop-shadow(0 0 14px rgb(91 108 255 / 0.4)); }
        to { filter: drop-shadow(0 0 26px rgb(91 108 255 / 0.68)); }
      }

      @keyframes name-reveal {
        from { opacity: 0; transform: translateY(8px); letter-spacing: 0.36em; }
        to { opacity: 1; transform: translateY(0); letter-spacing: 0.2em; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-label="Distop">
      <div class="identity">
        <img class="logo" src="./assets/icon.png" alt="" />
        <div class="brand">Distop</div>
      </div>
    </main>

    <audio id="reveal-sound" preload="auto" src="./assets/splash-reveal.mp3"></audio>
    <script>
      (() => {
        const sound = document.querySelector("#reveal-sound");
        if (!(sound instanceof HTMLAudioElement)) return;
        sound.volume = 0.56;
        sound.playbackRate = 1.06;
        sound.play().catch(() => undefined);

        const observer = new MutationObserver(() => {
          if (!document.body.classList.contains("is-leaving")) return;
          observer.disconnect();
          const initialVolume = sound.volume;
          const startedAt = performance.now();
          const fade = (now) => {
            const progress = Math.min(1, (now - startedAt) / 220);
            sound.volume = initialVolume * (1 - progress);
            if (progress < 1) requestAnimationFrame(fade);
          };
          requestAnimationFrame(fade);
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });
      })();
    </script>
  </body>
</html>
