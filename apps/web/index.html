<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: con el teclado abierto la página se encoge en vez de
         quedar tapada, así la caja de escribir sube por encima del teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Distop</title>
    <meta name="description" content="Plataforma de comunicación comunitaria, abierta y self-hosted. Sin funciones bajo llave." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />

    <!-- Tipografías autoalojadas vía Fontsource (importadas en main.tsx):
         cero peticiones a Google en cada carga (§8). -->

    <script>
      // Antes de pintar: evita el flash de tema equivocado al recargar.
      (() => {
        const saved = localStorage.getItem("distop.theme") || "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Distop necesita JavaScript para el chat en tiempo real.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
